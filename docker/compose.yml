services:
  ecosort-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ecosort-ai:latest
    ports:
      - "8501:8501"
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - ../models:/app/models:ro
    restart: unless-stopped

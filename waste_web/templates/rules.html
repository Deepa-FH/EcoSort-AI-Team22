<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waste rules — Sortly</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body><main class="app-shell dashboard-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">♻</span><span><strong>Sortly</strong><small>Admin rules</small></span></div><nav class="nav-list"><a class="nav-item nav-link" href="{{ url_for('home') }}"><span>←</span><span>Assistant</span></a><a class="nav-item nav-link" href="{{ url_for('dashboard') }}"><span>▦</span><span>Dashboard</span></a><a class="nav-item nav-link" href="{{ url_for('history') }}"><span>◷</span><span>Scan history</span></a><a class="nav-item nav-link active" href="{{ url_for('admin_rules') }}"><span>⚙</span><span>Waste rules</span></a></nav><form method="post" action="{{ url_for('logout') }}" class="logout-form"><button class="nav-item logout-button" type="submit"><span>↪</span><span>Sign out</span></button></form></aside><section class="workspace dashboard-workspace"><header class="topbar"><div><h1>Administrator rules</h1><p>Edit local guidance used by the assistant and included in Sortly AI prompts.</p></div></header><div class="dashboard-content"><div class="rules-grid">{% for label, rule in rules.items() %}<form class="rule-card" data-label="{{ label }}"><h2>{{ label.replace('_',' ') }}</h2><label>Category<input name="category" value="{{ rule.category }}"></label><label>Bin<input name="bin" value="{{ rule.bin }}"></label><label>German name<input name="bin_de" value="{{ rule.bin_de }}"></label><label>Color<input name="color" value="{{ rule.color }}"></label><label>Hex color<input name="hex" value="{{ rule.hex }}"></label><label>Guidance<textarea name="note" rows="3">{{ rule.note }}</textarea></label><input type="hidden" name="theme" value="{{ rule.theme }}"><input type="hidden" name="symbol" value="{{ rule.symbol }}"><button class="login-button" type="submit">Save rule</button><small class="rule-status"></small></form>{% endfor %}</div></div></section></main><script>document.querySelectorAll('.rule-card').forEach(form=>form.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));data.label=form.dataset.label;const res=await fetch('/api/admin/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await res.json();form.querySelector('.rule-status').textContent=res.ok?'Saved':'Error: '+(out.error||'Unable to save')}));</script></body></html>
